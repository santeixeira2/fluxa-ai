services:
  postgres:
    image: postgres:16-alpine
    container_name: fluxa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fluxa
      POSTGRES_PASSWORD: fluxa_secret
      POSTGRES_DB: fluxa
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxa"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fluxa-redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: fluxa-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  fluxa-api:
    build:
      context: ./fluxa-api
      dockerfile: Dockerfile
    container_name: fluxa-api
    restart: unless-stopped
    env_file: ./fluxa-api/.env
    environment:
      DATABASE_URL: postgresql://fluxa:fluxa_secret@postgres:5432/fluxa
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: fluxa-files
    volumes:
      - ./fluxa-api/prisma/migrations:/app/prisma/migrations
    command: sh -c "node_modules/.bin/prisma migrate deploy && node dist/server.js"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  fluxa-ui:
    build:
      context: ./fluxa-ui
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: fluxa-ui
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - fluxa-api

volumes:
  postgres_data:
  redis_data:
  minio_data:
